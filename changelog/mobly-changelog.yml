- date: '2026-08-07'
  title: Week of August 3, 2026
  tags: [Hub, Integrations, Mobile App, New, Improvement, Fix]
  summary: Multi-integration support, mobile SSO, and voice transcripts push through
    to CRMs.
  breaking: false
  api_affecting: false
  highlights:
  - Multi-integration support (Salesforce foundation) — a secondary integration
    alongside the primary CRM
  - Mobile SSO (SAML) via a hosted bridge; SSO customers must add auth.getmobly.com
    as an approved domain
  - Voice-recording transcripts pushed through to the CRM lead activity record
  - Company Size added to enriched lead data
  - Improved badge OCR accuracy and lead deduplication
- date: '2026-07-31'
  title: Week of July 27, 2026
  tags: [Hub, Mobile App, Integrations, New]
  summary: 'The two biggest product changes of the year land the same week:
    multi-type qualifiers and the Labels rename.'
  breaking: true
  breaking_note: >-
    "Campaigns" was renamed to "Labels" across the Hub, mobile app and help
    center. A rename of a customer-facing concept; the published REST API v0
    surface still exposes the tagGroups/qualifier vocabulary.
  highlights:
  - Multi-type qualifiers — picklist, open text, numeric, boolean, note activity
  - Three-way Required control (Off / Important / Require)
  - Auto Create from CRM wizard for Salesforce, HubSpot, Zoho CRM and Marketo
  - Campaigns renamed to Labels
