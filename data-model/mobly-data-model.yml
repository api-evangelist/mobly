api: Mobly REST API v0
summary:
  entities: 9
  schemas_in_spec: 45
  id_style: >-
    MIXED and undocumented — Event.id is an int64 integer (path param typed
    integer), while Lead.id, Activation.id, TagGroup.id, IndustryEvent.id and
    LeadActivityEvent.id are all string UUIDs. No typed id prefixes are
    published, so an id is only meaningful together with its collection, and a
    client cannot assume one id type across the API.
  tenancy: >-
    Every collection is implicitly scoped to the organization that owns the
    API key; there is no organization resource or organizationId field on the
    public v0 surface.
