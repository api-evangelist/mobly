aid: mobly
name: Mob.ly
description: >-
  Mob.ly (Mobly) is an AI-powered event marketing platform — "The Event
  Marketer's Operating System" — that helps B2B go-to-market teams plan events,
  capture and enrich leads in person, engage prospects, and measure pipeline
  across trade shows and in-real-life (IRL) marketing experiences. Its product
  suite spans lead Capture, event Host, Insights reporting, Pulse, and Scout,
  with native integrations into HubSpot, Salesforce, Marketo, and generic
  webhooks. As of this enrichment pass Mobly operates a customer-facing web
  application (hub.getmobly.com) but publishes no public developer API,
  OpenAPI specification, SDKs, or developer documentation. Backed by Uncork
  Capital.
