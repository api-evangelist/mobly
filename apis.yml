aid: mobly
name: Mob.ly
description: >-
  Mob.ly (Mobly) is an AI-powered in-person go-to-market platform — "The Event
  Marketer's Operating System" — that helps B2B teams plan events, capture and
  enrich leads in person, engage prospects, and measure pipeline across trade
  shows and in-real-life (IRL) marketing experiences. Its product suite spans
  Capture (universal lead capture and OCR badge/business-card scanning), Host
  (self-run activations, registration pages and Stripe-backed ticketing),
  Insights (dashboards and reporting), Pulse (speed-to-lead sequences and lead
  routing) and Scout (event discovery), with native integrations into HubSpot,
  Salesforce, Pardot, Marketo, Pipedrive, Zoho, Slack, Calendly and generic
  webhook destinations. Mobly publishes a JSON REST API (v0) at
  core-api.getmobly.com covering events, leads, lead activity events,
  activations, tag groups and industry events, authenticated with an
  organization API key issued by its customer success team. Headquartered in
  Lehi, Utah and backed by Uncork Capital and Jump Capital.
