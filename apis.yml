  name: Mobly REST API v0
  description: >-
    The Mobly REST API (v0) gives programmatic access to events, leads, lead
    activity events, activations, qualifier/tag groups and industry events for
    the authenticated organization. All endpoints are JSON, versioned under
    /v0, authenticated with an `x-api-key` header, paginated with limit/offset,
    and rate limited per API key with a token bucket that returns
    X-RateLimit-* headers on every response.
